<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <title>Sign In - LocalBazar</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="pwa.css?v=7">

    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="LocalBazar">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>
<body class="auth-body">

    <!-- Pure Minimal Auth Stage -->
    <main class="auth-main">
        <div class="auth-card">
            <!-- Brand Logo -->
            <div class="card-brand-header">
                <a href="index.html" class="auth-brand-logo" title="LocalBazar Home">
                    <div class="brand-icon-sm"><i class="fa-solid fa-store"></i></div>
                    <span>Local<span>Bazar</span></span>
                </a>
            </div>

            <!-- Welcome Text -->
            <div class="auth-header-text">
                <h2>Explore your city</h2>
                <p>Sign in to save places, write reviews, and manage your local listings.</p>
            </div>

            <!-- Primary One-Click Social Actions -->
            <div class="auth-actions">
                <button type="button" class="btn-social-full btn-google" id="googleLoginBtn">
                    <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Continue with Google</span>
                </button>
            </div>

            <!-- Trust / Safety Badge -->
            <div class="auth-security-note">
                <i class="fa-solid fa-shield-halved"></i>
                <span>Fast, verified and secure sign-in</span>
            </div>

            <!-- Footer Agreement -->
            <div class="auth-card-footer">
                <p>By continuing, you agree to LocalBazar's <a href="#">Terms of Service</a> & <a href="#">Privacy Policy</a>.</p>
            </div>
        </div>
    </main>

    <!-- Firebase Cloud SDK & Central Config -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="app-nav.js"></script>
    <script src="pwa.js"></script>
</body>
</html>
